name: Publish to PyPI

on:
  release:
    types: [published]  # Trigger only when a GitHub Release is published.

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: pypi  # Match this to your configured GitHub Environment.
    permissions:
      id-token: write #Mandatory for PyPi Trusted Publishing (configured at pypi.org)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify Slack
        if: ${{ !cancelled() }}
        # 1.0.13
        uses: cognizant-ai-lab/build-common/actions/slack-notify@e11ab4d3725a79bd8b28c3f7fb0785615290cf24
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
