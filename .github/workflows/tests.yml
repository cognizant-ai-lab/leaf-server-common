name: Test

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y shellcheck
          pip install -r requirements-build.txt
          pip install -r requirements.txt

      - name: Show installed packages
        run: pip freeze

      - name: Run pylint
        run: build_scripts/run_pylint.sh

      - name: Run shellcheck
        run: build_scripts/run_shellcheck.sh

      - name: Run flake8
        run: flake8

      - name: Run pytest (excluding integration tests)
        run: pytest --verbose -m "not integration" --timer-top-n 10 --cov-config=.coveragerc --cov

      - name: Check README renders correctly on PyPI
        run: |
          pip install readme_renderer readme_renderer[md]
          python -m readme_renderer README.md

      - name: Notify Slack
        if: ${{ !cancelled() }}
        # 1.0.13
        uses: cognizant-ai-lab/build-common/actions/slack-notify@e11ab4d3725a79bd8b28c3f7fb0785615290cf24
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
